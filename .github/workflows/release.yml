name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'          # triggers on any version tag e.g. v3.3.0
  workflow_dispatch:       # allows manual trigger from GitHub Actions UI
    inputs:
      version:
        description: 'Version to release (e.g. 3.3.0)'
        required: false
        default: ''

permissions:
  contents: write          # needed to create releases and upload assets

jobs:
  build-windows:
    name: Build Windows (NSIS + Portable)
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. Install dependencies ───────────────────────────────────────
      - name: Install dependencies
        run: npm install

      # ── 4. Determine version ─────────────────────────────────────────
      - name: Get version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"          # e.g. v3.3.0
            VERSION="${VERSION#v}"                     # strip leading v → 3.3.0
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      # ── 5. Build Windows targets ──────────────────────────────────────
      - name: Build (NSIS Installer + Portable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish never

      # ── 6. List artifacts ─────────────────────────────────────────────
      - name: List dist directory
        shell: bash
        run: ls -lh dist/

      # ── 7. Upload artifacts to workflow run ───────────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaimuAi-Setup-${{ steps.version.outputs.version }}
          path: dist/HaimuAi-Setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: warn

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaimuAi-Portable-${{ steps.version.outputs.version }}
          path: dist/HaimuAi-Portable-${{ steps.version.outputs.version }}.exe
          if-no-files-found: warn

      # ── 8. Create GitHub Release (only on tag push) ───────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: HaimuAi v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## HaimuAi v${{ steps.version.outputs.version }}

            ### 🆕 What's in this release
            - 🎙️ **Voice transcription fixed** — now works for ALL users (Free Mode, ChatGPT linked, and licensed)
            - 🤖 **Real ChatGPT session linking** — "Link ChatGPT" now opens a browser window, auto-detects your login, and extracts your OpenAI access token. No manual steps needed.
            - 🔊 **OpenAI Whisper transcription** — when ChatGPT is linked, voice uses Whisper (OpenAI's official speech-to-text) automatically
            - 💬 **ChatGPT as AI provider** — if you have ChatGPT linked and no Gemini key, HaimuAi uses GPT-4o-mini for all AI responses
            - ⚡ **Smart provider fallback** — Free Mode (Gemini) → ChatGPT (OpenAI) → Server (licensed) — automatically picks what's available
            - 🛡️ **SEB/Respondus/LockDown Browser bypass** — zero user interaction, detects within 2s
            - 🎨 **Premium glassmorphism UI** with gradients and micro-animations

            ### ⬇️ Download
            | File | Description |
            |------|-------------|
            | `HaimuAi-Setup-${{ steps.version.outputs.version }}.exe` | **Installer** (recommended) |
            | `HaimuAi-Portable-${{ steps.version.outputs.version }}.exe` | **Portable** — no install needed, just run |

            ### 🔧 Three ways to use HaimuAi (no license needed for first two!)

            #### 🆓 Option 1 — Free Mode (Gemini API key)
            1. Download and run either version above
            2. On the activation screen → press **✕** → click **⚙️** gear
            3. Go to **API Keys** → paste your [free Gemini key](https://aistudio.google.com/apikey) → enable **Free Mode** → Save

            > 💡 Add 2–3 keys for automatic quota failover — HaimuAi rotates keys when one hits the daily limit.

            #### 🤖 Option 2 — Link ChatGPT (uses your ChatGPT account)
            1. Download and run, skip activation with **✕**
            2. Click **⚙️** gear → scroll to **ChatGPT Connection** → click **Link ChatGPT**
            3. Sign into ChatGPT in the window that opens — linking happens automatically!
            4. Voice transcription uses Whisper, AI chat uses GPT-4o-mini

            #### 🔑 Option 3 — Licensed (full server-side AI, priority support)
            - Enter your license key on the activation screen

          files: |
            dist/HaimuAi-Setup-${{ steps.version.outputs.version }}.exe
            dist/HaimuAi-Portable-${{ steps.version.outputs.version }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
